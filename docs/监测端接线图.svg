<svg viewBox="0 0 1060 1000" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="530" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">智能温度监测报警器 · 监测端接线图（STM32F103C8T6）</text>

  <!-- ============ 左列：最小系统 ============ -->
  <rect x="40" y="60" width="240" height="92" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">① 电源</text>
  <text x="160" y="105" text-anchor="middle" font-size="12" fill="#1f2937">USB 5V → AMS1117-3.3</text>
  <text x="160" y="125" text-anchor="middle" font-size="12" fill="#1f2937">输出 3.3V 供电轨</text>
  <text x="160" y="143" text-anchor="middle" font-size="11" fill="#6b7280">VCC=3.3V，GND 全程共地</text>

  <rect x="40" y="172" width="240" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">② 晶振 HSE 8MHz</text>
  <text x="160" y="217" text-anchor="middle" font-size="12" fill="#1f2937">接 OSC_IN / OSC_OUT</text>
  <text x="160" y="237" text-anchor="middle" font-size="12" fill="#1f2937">两脚各并 20pF 到 GND</text>
  <text x="160" y="255" text-anchor="middle" font-size="11" fill="#6b7280">（不接也能用内部 RC，精度差）</text>

  <rect x="40" y="284" width="240" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">③ 复位电路</text>
  <text x="160" y="329" text-anchor="middle" font-size="12" fill="#1f2937">NRST ──10kΩ── 3.3V</text>
  <text x="160" y="349" text-anchor="middle" font-size="12" fill="#1f2937">NRST ──100nF── GND</text>
  <text x="160" y="367" text-anchor="middle" font-size="11" fill="#6b7280">可选：复位按键一端 NRST 一端 GND</text>

  <rect x="40" y="396" width="240" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">④ 启动模式</text>
  <text x="160" y="441" text-anchor="middle" font-size="12" fill="#1f2937">BOOT0 ──10kΩ── GND</text>
  <text x="160" y="459" text-anchor="middle" font-size="11" fill="#6b7280">正常运行 BOOT0=0</text>

  <rect x="40" y="488" width="240" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">⑤ 下载/调试口 SWD</text>
  <text x="160" y="533" text-anchor="middle" font-size="12" fill="#1f2937">SWDIO = PA13</text>
  <text x="160" y="553" text-anchor="middle" font-size="12" fill="#1f2937">SWCLK = PA14</text>
  <text x="160" y="571" text-anchor="middle" font-size="11" fill="#6b7280">接 ST-Link / DAPLink / J-Link</text>

  <!-- ============ 中列：STM32 ============ -->
  <rect x="320" y="60" width="280" height="860" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="460" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3">STM32F103C8T6</text>
  <text x="460" y="110" text-anchor="middle" font-size="11" fill="#6b7280">Cortex-M3 · 72MHz · 64KB Flash</text>

  <text x="335" y="145" font-size="11" fill="#6b7280">PA9  (USART1_TX)</text>
  <text x="335" y="185" font-size="11" fill="#6b7280">PA10 (USART1_RX)</text>
  <text x="335" y="225" font-size="11" fill="#6b7280">PA6  (TIM3_CH1 PWM)</text>
  <text x="335" y="265" font-size="11" fill="#6b7280">PA1  (LED1)</text>
  <text x="335" y="305" font-size="11" fill="#6b7280">PA2  (LED2)</text>
  <text x="335" y="345" font-size="11" fill="#6b7280">PB0  (蜂鸣器)</text>
  <text x="335" y="385" font-size="11" fill="#6b7280">PB1  (Key1)</text>
  <text x="335" y="425" font-size="11" fill="#6b7280">PB11 (Key2)</text>
  <text x="335" y="465" font-size="11" fill="#6b7280">PB8  (OLED_SCL)</text>
  <text x="335" y="505" font-size="11" fill="#6b7280">PB9  (OLED_SDA)</text>
  <text x="335" y="545" font-size="11" fill="#6b7280">PB10 (DS18B20_DQ)</text>
  <text x="335" y="585" font-size="11" fill="#6b7280">PB6  (NRF_CE)</text>
  <text x="335" y="625" font-size="11" fill="#6b7280">PB12 (NRF_CSN)</text>
  <text x="335" y="665" font-size="11" fill="#6b7280">PB13 (NRF_SCK)</text>
  <text x="335" y="705" font-size="11" fill="#6b7280">PB14 (NRF_MISO)</text>
  <text x="335" y="745" font-size="11" fill="#6b7280">PB15 (NRF_MOSI)</text>

  <!-- 右侧引脚排线 -->
  <line x1="600" y1="145" x2="660" y2="145" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="185" x2="660" y2="185" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="225" x2="660" y2="225" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="265" x2="660" y2="265" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="305" x2="660" y2="305" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="345" x2="660" y2="345" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="385" x2="660" y2="385" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="425" x2="660" y2="425" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="465" x2="660" y2="465" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="505" x2="660" y2="505" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="545" x2="660" y2="545" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="585" x2="660" y2="585" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="625" x2="660" y2="625" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="665" x2="660" y2="665" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="705" x2="660" y2="705" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="745" x2="660" y2="745" stroke="#94a3b8" stroke-width="1"/>

  <!-- ============ 右列：外设 ============ -->
  <rect x="660" y="110" width="360" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="840" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">DS18B20 温度传感器</text>
  <text x="840" y="154" text-anchor="middle" font-size="12" fill="#1f2937">DQ → PB10，DQ ──4.7kΩ── 3.3V（上拉）</text>
  <text x="840" y="172" text-anchor="middle" font-size="11" fill="#6b7280">VDD → 3.3V，GND → GND</text>

  <rect x="660" y="200" width="360" height="80" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="840" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">OLED 0.96"（I²C）</text>
  <text x="840" y="244" text-anchor="middle" font-size="12" fill="#1f2937">SCL → PB8，SDA → PB9</text>
  <text x="840" y="262" text-anchor="middle" font-size="12" fill="#1f2937">SCL/SDA 各 ──4.7kΩ── 3.3V</text>
  <text x="840" y="278" text-anchor="middle" font-size="11" fill="#6b7280">VCC → 3.3V，GND → GND</text>

  <rect x="660" y="300" width="360" height="80" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="840" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">按键 ×2</text>
  <text x="840" y="344" text-anchor="middle" font-size="12" fill="#1f2937">Key1 → PB1，Key2 → PB11</text>
  <text x="840" y="362" text-anchor="middle" font-size="12" fill="#1f2937">按键另一端 → GND</text>
  <text x="840" y="378" text-anchor="middle" font-size="11" fill="#6b7280">按下为低电平（代码用内部上拉 IPU）</text>

  <rect x="660" y="400" width="360" height="80" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="840" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">有源蜂鸣器</text>
  <text x="840" y="444" text-anchor="middle" font-size="12" fill="#1f2937">PB0 ──1kΩ── NPN 基极（如 S8050）</text>
  <text x="840" y="462" text-anchor="middle" font-size="12" fill="#1f2937">蜂鸣器+ → 3.3V，− → 集电极，发射极 → GND</text>
  <text x="840" y="478" text-anchor="middle" font-size="11" fill="#6b7280">若直接驱动：PB0 ──1kΩ── 蜂鸣器 ── GND</text>

  <rect x="660" y="500" width="360" height="80" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="840" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">LED ×2（低电平点亮）</text>
  <text x="840" y="544" text-anchor="middle" font-size="12" fill="#1f2937">PA1 ──1kΩ── LED1 正极，LED1 负极 → GND</text>
  <text x="840" y="562" text-anchor="middle" font-size="12" fill="#1f2937">PA2 ──1kΩ── LED2 正极，LED2 负极 → GND</text>
  <text x="840" y="578" text-anchor="middle" font-size="11" fill="#6b7280">输出低电平 = 亮</text>

  <rect x="660" y="600" width="360" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="840" y="624" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">PWM 电压输出 0~3.3V</text>
  <text x="840" y="644" text-anchor="middle" font-size="12" fill="#1f2937">PA6 ──10kΩ── 输出端子</text>
  <text x="840" y="662" text-anchor="middle" font-size="12" fill="#1f2937">输出端子 ──100nF── GND</text>
  <text x="840" y="678" text-anchor="middle" font-size="11" fill="#6b7280">RC 低通滤波，得到平滑直流</text>

  <rect x="660" y="700" width="360" height="80" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="840" y="724" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">USART1（本地串口，可选）</text>
  <text x="840" y="744" text-anchor="middle" font-size="12" fill="#1f2937">PA9(TX) → USB-TTL 的 RX</text>
  <text x="840" y="762" text-anchor="middle" font-size="12" fill="#1f2937">PA10(RX) ← USB-TTL 的 TX，共 GND</text>
  <text x="840" y="778" text-anchor="middle" font-size="11" fill="#6b7280">115200，用于设阈值/调试</text>

  <rect x="660" y="800" width="360" height="150" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="840" y="824" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">NRF24L01 无线模块（SPI2）</text>
  <text x="840" y="846" text-anchor="middle" font-size="12" fill="#1f2937">VCC → 3.3V（⚠ 勿接 5V），GND → GND</text>
  <text x="840" y="866" text-anchor="middle" font-size="12" fill="#1f2937">CE → PB6，CSN → PB12</text>
  <text x="840" y="886" text-anchor="middle" font-size="12" fill="#1f2937">SCK → PB13，MOSI → PB15，MISO → PB14</text>
  <text x="840" y="906" text-anchor="middle" font-size="12" fill="#1f2937">IRQ → 不接</text>
  <text x="840" y="926" text-anchor="middle" font-size="11" fill="#6b7280">电源建议并 10µF + 100nF 电容，模块离单片机近一些</text>
  <text x="840" y="942" text-anchor="middle" font-size="11" fill="#6b7280">频道 76 / 1Mbps / 地址 12 34 56 78 9A / 负载 16B</text>

  <!-- 连线：引脚 -> 外设 -->
  <line x1="600" y1="545" x2="660" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="465" x2="660" y2="235" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="505" x2="660" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="385" x2="660" y2="335" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="425" x2="660" y2="350" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="345" x2="660" y2="435" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="265" x2="660" y2="540" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="305" x2="660" y2="556" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="225" x2="660" y2="635" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="145" x2="660" y2="735" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="185" x2="660" y2="750" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="585" x2="660" y2="860" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="625" x2="660" y2="872" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="665" x2="660" y2="884" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="705" x2="660" y2="896" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="745" x2="660" y2="908" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="530" y="985" text-anchor="middle" font-size="12" fill="#6b7280">虚线为对应引脚到外设的走线 · 所有 GND 共地 · NRF24L01 必须 3.3V 供电</text>
</svg>
